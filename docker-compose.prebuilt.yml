services:
  postgres:
    image: ${EVENTLAKE_POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventlake
      POSTGRES_USER: eventlake
      POSTGRES_PASSWORD: eventlake
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - eventlake_postgres_data:/var/lib/postgresql/data

  eventlake:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
      args:
        EVENTLAKE_BINARY: ${EVENTLAKE_PREBUILT_BINARY:-deploy/prebuilt/eventlake}
    image: eventlake:prebuilt
    restart: unless-stopped
    env_file:
      - ${EVENTLAKE_ENV_FILE:-.env.example}
    environment:
      EVENTLAKE_HTTP_HOST: 0.0.0.0
      EVENTLAKE_HTTP_PORT: ${EVENTLAKE_HTTP_PORT:-8080}
    ports:
      - "${EVENTLAKE_HTTP_PORT:-8080}:${EVENTLAKE_HTTP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  eventlake_postgres_data:
