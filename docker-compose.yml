services:
  clickhouse:
    image: ${EVENTLAKE_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: eventlake
      CLICKHOUSE_USER: eventlake
      CLICKHOUSE_PASSWORD: eventlake
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./logs/clickhouse:/var/log/clickhouse-server
      - ./clickhouse/config.d/system_logs.xml:/etc/clickhouse-server/config.d/system_logs.xml:ro
      - ./clickhouse/users.d/tuning.xml:/etc/clickhouse-server/users.d/tuning.xml:ro
      - /tmp:/tmp
      - ./backups:/backups

  eventlake:
    build:
      context: .
      dockerfile: Dockerfile
      target: prebuilt
      args:
        GITHUB_REPO: ${EVENTLAKE_GITHUB_REPO:-xzsean666/EVMEventLake}
        EVENTLAKE_VERSION: ${EVENTLAKE_VERSION:-latest}
        EVENTLAKE_DOWNLOAD_URL: ${EVENTLAKE_DOWNLOAD_URL:-}
        USE_CN_PROXY: ${EVENTLAKE_CN_PROXY:-false}
        EVENTLAKE_BINARY: ${EVENTLAKE_PREBUILT_BINARY:-deploy/prebuilt/eventlake}
    image: ${EVENTLAKE_IMAGE:-eventlake:local}
    restart: unless-stopped
    env_file:
      - ${EVENTLAKE_ENV_FILE:-.env.example}
    environment:
      EVENTLAKE_HTTP_HOST: 0.0.0.0
      EVENTLAKE_HTTP_PORT: ${EVENTLAKE_HTTP_PORT:-8080}
      EVENTLAKE_DATABASE_URL: sqlite:///data/eventlake.db?mode=rwc
      EVENTLAKE_CLICKHOUSE_ENABLED: "true"
      EVENTLAKE_CLICKHOUSE_URL: ${EVENTLAKE_CLICKHOUSE_URL:-http://eventlake:eventlake@clickhouse:8123/eventlake}
    ports:
      - "${EVENTLAKE_HTTP_PORT:-8080}:${EVENTLAKE_HTTP_PORT:-8080}"
    volumes:
      - ./data/sqlite:/data
    depends_on:
      clickhouse:
        condition: service_healthy
