services:
  postgres:
    image: ${EVENTLAKE_POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventlake
      POSTGRES_USER: eventlake
      POSTGRES_PASSWORD: eventlake
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  clickhouse:
    image: ${EVENTLAKE_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: eventlake
      CLICKHOUSE_USER: eventlake
      CLICKHOUSE_PASSWORD: eventlake
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./logs/clickhouse:/var/log/clickhouse-server

  eventlake:
    build:
      context: .
      dockerfile: Dockerfile.clickhouse
    image: eventlake:clickhouse
    restart: unless-stopped
    env_file:
      - ${EVENTLAKE_ENV_FILE:-.env.example}
    environment:
      EVENTLAKE_HTTP_HOST: 0.0.0.0
      EVENTLAKE_HTTP_PORT: ${EVENTLAKE_HTTP_PORT:-8080}
      EVENTLAKE_CLICKHOUSE_ENABLED: "true"
      EVENTLAKE_CLICKHOUSE_HOST: clickhouse
      EVENTLAKE_CLICKHOUSE_PORT: ${EVENTLAKE_CLICKHOUSE_PORT:-8123}
      EVENTLAKE_CLICKHOUSE_USER: ${EVENTLAKE_CLICKHOUSE_USER:-eventlake}
      EVENTLAKE_CLICKHOUSE_PASSWORD: ${EVENTLAKE_CLICKHOUSE_PASSWORD:-eventlake}
      EVENTLAKE_CLICKHOUSE_DB: ${EVENTLAKE_CLICKHOUSE_DB:-eventlake}
    ports:
      - "${EVENTLAKE_HTTP_PORT:-8080}:${EVENTLAKE_HTTP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
