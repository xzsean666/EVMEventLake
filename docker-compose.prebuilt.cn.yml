services:
  postgres:
    image: ${EVENTLAKE_POSTGRES_IMAGE:-m.daocloud.io/docker.io/library/postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventlake
      POSTGRES_USER: eventlake
      POSTGRES_PASSWORD: eventlake
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - eventlake_postgres_data:/var/lib/postgresql/data

  eventlake:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt.cn
      args:
        EVENTLAKE_BINARY: ${EVENTLAKE_PREBUILT_BINARY:-deploy/prebuilt/eventlake}
        DEBIAN_IMAGE: ${EVENTLAKE_DEBIAN_IMAGE:-m.daocloud.io/docker.io/library/debian:bookworm-slim}
        DEBIAN_MIRROR: ${EVENTLAKE_DEBIAN_MIRROR:-http://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${EVENTLAKE_DEBIAN_SECURITY_MIRROR:-http://mirrors.aliyun.com/debian-security}
    image: eventlake:prebuilt-cn
    restart: unless-stopped
    env_file:
      - ${EVENTLAKE_ENV_FILE:-.env.example}
    environment:
      EVENTLAKE_HTTP_HOST: 0.0.0.0
      EVENTLAKE_HTTP_PORT: ${EVENTLAKE_HTTP_PORT:-8080}
      SSH_TUNNEL_ENABLED: ${SSH_TUNNEL_ENABLED:-false}
      SSH_TUNNEL_HOST: ${SSH_TUNNEL_HOST:-}
      SSH_TUNNEL_PORT: ${SSH_TUNNEL_PORT:-22}
      SSH_TUNNEL_USER: ${SSH_TUNNEL_USER:-root}
      SSH_TUNNEL_SOCKS_BIND_HOST: ${SSH_TUNNEL_SOCKS_BIND_HOST:-127.0.0.1}
      SSH_TUNNEL_SOCKS_PORT: ${SSH_TUNNEL_SOCKS_PORT:-1080}
      SSH_TUNNEL_PRIVATE_KEY_B64: ${SSH_TUNNEL_PRIVATE_KEY_B64:-}
      SSH_TUNNEL_PRIVATE_KEY: ${SSH_TUNNEL_PRIVATE_KEY:-}
      SSH_TUNNEL_PRIVATE_KEY_FILE: ${SSH_TUNNEL_PRIVATE_KEY_FILE:-}
      SSH_TUNNEL_KNOWN_HOSTS: ${SSH_TUNNEL_KNOWN_HOSTS:-}
      SSH_TUNNEL_STRICT_HOST_KEY_CHECKING: ${SSH_TUNNEL_STRICT_HOST_KEY_CHECKING:-accept-new}
      SSH_TUNNEL_NO_PROXY: ${SSH_TUNNEL_NO_PROXY:-127.0.0.1,localhost,::1,postgres,eventlake}
    ports:
      - "${EVENTLAKE_HTTP_PORT:-8080}:${EVENTLAKE_HTTP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  eventlake_postgres_data:
