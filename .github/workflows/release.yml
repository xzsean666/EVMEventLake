name: Release and Build Prebuilt

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: '版本递增类型 (Version bump type)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: '自定义版本号 (当 bump_type 选择 custom 时有效，如 0.2.0 或 v0.2.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Release & Publish Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Determine and bump version
        id: version_step
        run: |
          set -euo pipefail

          # 从 Cargo.toml 读取当前版本
          current_version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "Current version in Cargo.toml: ${current_version}"

          bump_type="${{ github.event.inputs.bump_type }}"
          custom_version="${{ github.event.inputs.custom_version }}"

          # 使用 Python 处理语义化版本计算
          new_version=$(python3 - <<EOF
          import sys

          current = "${current_version}".strip().lstrip('v')
          bump = "${bump_type}".strip()
          custom = "${custom_version}".strip().lstrip('v')

          if bump == 'custom':
              if not custom:
                  print("Error: custom_version cannot be empty when bump_type is custom", file=sys.stderr)
                  sys.exit(1)
              print(custom)
              sys.exit(0)

          parts = [int(p) for p in current.split('.')]
          while len(parts) < 3:
              parts.append(0)

          major, minor, patch = parts[0], parts[1], parts[2]

          if bump == 'patch':
              patch += 1
          elif bump == 'minor':
              minor += 1
              patch = 0
          elif bump == 'major':
              major += 1
              minor = 0
              patch = 0
          else:
              print(f"Unknown bump type: {bump}", file=sys.stderr)
              sys.exit(1)

          print(f"{major}.{minor}.{patch}")
          EOF
          )

          echo "Calculated new version: ${new_version}"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${new_version}" >> "$GITHUB_OUTPUT"

          # 更新 Cargo.toml 版本
          sed -i -E '0,/^version = ".*"/s//version = "'"$new_version"'"/' Cargo.toml

          # 同步更新 Cargo.lock
          cargo check --ignore-rust-version --offline >/dev/null 2>&1 || cargo check --ignore-rust-version >/dev/null 2>&1

          # 配置 Git 提交与打 Tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to v${new_version} [skip ci]"
          git tag -a "v${new_version}" -m "Release v${new_version}"
          
          # 推送 commit 与 tag 到当前分支
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${new_version}"

      - name: Build release binary
        run: |
          cargo build --release --locked --ignore-rust-version
          strip target/release/eventlake

      - name: Package release assets
        run: |
          set -euo pipefail
          version="${{ steps.version_step.outputs.new_version }}"
          mkdir -p dist
          archive_name="eventlake-v${version}-linux-amd64.tar.gz"

          tar -czvf "dist/${archive_name}" -C target/release eventlake
          cd dist
          sha256sum "${archive_name}" > "${archive_name}.sha256"
          cd ..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version_step.outputs.tag_name }}
          VERSION: ${{ steps.version_step.outputs.new_version }}
        run: |
          repo_owner_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          gh release create "$TAG_NAME" \
            dist/* \
            --title "Release $TAG_NAME" \
            --notes "### EVMEventLake $TAG_NAME

          #### 📦 Prebuilt Binary (Linux x86_64)
          - \`eventlake-v${VERSION}-linux-amd64.tar.gz\`

          一键安装/更新二进制（零编译）：
          \`\`\`bash
          curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
          \`\`\`

          #### 🐳 Prebuilt Docker Image (GHCR)
          - \`ghcr.io/${repo_owner_lower}/evmeventlake:latest\`
          - \`ghcr.io/${repo_owner_lower}/evmeventlake:v${VERSION}\`

          使用 Docker Compose 快速启动（零本地构建）：
          \`\`\`bash
          docker compose pull && docker compose up -d
          \`\`\`"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare prebuilt binary for Docker
        run: |
          mkdir -p deploy/prebuilt
          cp target/release/eventlake deploy/prebuilt/eventlake

      - name: Build and Push Docker image to GHCR
        run: |
          set -euo pipefail
          repo_owner_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          version="${{ steps.version_step.outputs.new_version }}"
          tag_latest="ghcr.io/${repo_owner_lower}/evmeventlake:latest"
          tag_version="ghcr.io/${repo_owner_lower}/evmeventlake:v${version}"

          docker build \
            --target prebuilt \
            -t "$tag_latest" \
            -t "$tag_version" \
            .

          docker push "$tag_latest"
          docker push "$tag_version"
